<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Library — Sign up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Signup.css">
</head>

<body>
    <div class="page">

        <header>
            <a href="/" class="brand">
                <svg width="30" height="26" viewBox="0 0 34 28">
                    <circle cx="12" cy="12" r="11" fill="#E85CA6" opacity="0.9" />
                    <circle cx="20" cy="14" r="9" fill="#8B5FBF" opacity="0.85" />
                    <circle cx="24" cy="20" r="5" fill="#7FC3E8" opacity="0.9" />
                </svg>
                <span>Library</span>
            </a>
        </header>

        <!-- faded background circles -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <div class="wrap">
            <div class="card">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M4 4v16M4 4h13a3 3 0 013 3v13H7a3 3 0 01-3-3V4z" />
                        <path d="M9 8h7M9 12h7" />
                    </svg>
                </div>
                <h1>Join the library</h1>
                <p class="subtitle">Create an account to reserve, read, and track</p>

                <form>
                    <div class="field">
                        <label for="su-name">Full Name</label>
                        <input id="su-name" type="text" placeholder="Maryum Binte Hossain">
                    </div>
                    <div class="field">
                        <label for="su-email">Email</label>
                        <input id="su-email" type="email" placeholder="you@email.com">
                    </div>
                    <div class="field">
                        <label for="su-pass">Password</label>
                        <input id="su-pass" type="password" placeholder="At least 8 characters">
                    </div>
                    <div class="field">
                        <label for="su-confirm">Confirm Password</label>
                        <input id="su-confirm" type="password" placeholder="••••••••">
                    </div>

                    <label class="terms">
                        <input type="checkbox">
                        <span>I agree to the library's membership terms and late fee policy</span>
                    </label>

                    <button type="submit" class="submit">Create Account</button>
                </form>

                <p class="switch">Already a member? <a href="Login.html">Log in</a></p>
            </div>
        </div>

    </div>
</body>

</html>
