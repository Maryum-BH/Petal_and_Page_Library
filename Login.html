<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Library — Log in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Login.css">
</head>

<body>
  <div class="page">

    <header>
      <a href="/" class="brand">
        <svg width="30" height="26" viewBox="0 0 34 28">
          <circle cx="12" cy="12" r="11" fill="#E85CA6" opacity="0.9" />
          <circle cx="20" cy="14" r="9" fill="#8B5FBF" opacity="0.85" />
          <circle cx="24" cy="20" r="5" fill="#7FC3E8" opacity="0.9" />
        </svg>
        <span>Library</span>
      </a>
    </header>

    <!-- faded background circles -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="wrap">
      <div class="card">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 4v16M4 4h13a3 3 0 013 3v13H7a3 3 0 01-3-3V4z" />
            <path d="M9 8h7M9 12h7" />
          </svg>
        </div>
        <h1>Welcome back, reader</h1>
        <p class="subtitle">Your shelf missed you</p>

        <form>
          <div class="field">
            <label for="login-id">Library ID or email</label>
            <input id="login-id" type="text" placeholder="LIB-00842 or you@email.com">
          </div>
          <div class="field">
            <div class="field-top">
              <label for="login-pass">Password</label>
              <a class="forgot" href="#">Forgot password?</a>
            </div>
            <input id="login-pass" type="password" placeholder="••••••••">
          </div>
          <button type="submit" class="submit">Log in</button>
        </form>

        <div class="divider">or</div>
        <p class="switch">New to the library? <a href="Signup.html">Create an account</a></p>
      </div>
    </div>

  </div>
</body>

</html>
