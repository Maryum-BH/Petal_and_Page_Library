<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <title>Process a Return</title>
    <link rel="stylesheet" href="Return.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="p-3 m-0 border-0 bd-example m-0 border-0 dashboard_page">
    <div class="container">
        <nav class="navbar my-navbar">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center gap-2" href="Dashboard.html">
                    <img class="image" src="library_icon_a.png" alt="Library Logo" width="60" height="50">
                    <p class="Library"><b>Library</b></p>
                </a>
                <div class="d-flex align-items-center gap-3">
                    <!-- MM -->
                    <div class="dropdown">
                        <button class="navbar-toggler bt_style" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <b>MM</b>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end nav-menu">
                            <li><a class="dropdown-item" href="Login.html">
                                <img src="Logout.png" alt="">
                                Logout</a></li>
                        </ul>
                    </div>
                    <!-- Hamburger -->
                    <div class="dropdown">
                        <button class="navbar-toggler bt_style" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end nav-menu">
                            <li><a class="dropdown-item" href="Dashboard.html">
                                <img src="dashboard-square.png" alt="">
                                Dashboard</a></li>
                            <li><a class="dropdown-item" href="Inventory.html">
                                <img src="Inventory.png" alt="">
                                Inventory</a></li>
                            <li><a class="dropdown-item" href="Reservations.html">
                                <img src="Reservations.png" alt="">
                                Reservations</a></li>
                            <li><a class="dropdown-item" href="Checkout.html">
                                <img src="Checkout.png" alt="">
                                Checkout</a></li>
                            <li><a class="dropdown-item" href="Return.html">
                                <img src="Return.png" alt="">
                                Returns</a></li>
                            <li><a class="dropdown-item" href="Fines.html">
                                <img src="Fines.png" alt="">
                                Fines</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        <div class="separator"></div>

        <div class="Return">
            <img src="return.png" alt="Return_icon">
            <p><b>Process a return</b></p>
        </div>

        <div class="search-row">
            <input type="text" placeholder="Search by borrower name, library ID, or book">
            <button type="button" class="find-btn">Find</button>
        </div>

        <div class="return-body">
            <!-- Loan Details -->
            <div class="return-col">
                <p class="col-label">Loan Details</p>
                <div class="loan-card">
                    <div class="loan-line">Borrower : Faija - LIB-00219</div>
                    <div class="loan-line">Book : Biology II</div>
                    <div class="loan-line">Due Date : July 22</div>
                    <div class="loan-line">Late fee : <span class="late-fee">&nbsp;50 tk - 5 days late</span></div>
                </div>
            </div>

            <!-- Book condition -->
            <div class="return-col">
                <p class="col-label">Book condition</p>
                <div class="condition-card">
                    <label class="condition-option">
                        <input type="radio" name="condition">
                        Excellent - no visible wear
                    </label>
                    <label class="condition-option">
                        <input type="radio" name="condition">
                        Good -minor wear
                    </label>
                    <label class="condition-option">
                        <input type="radio" name="condition">
                        Damaged - needs review
                    </label>
                </div>
            </div>
        </div>

        <div class="return-separator"></div>

        <div class="action-row">
            <button type="button" class="waive-btn">Waive Fee</button>
            <button type="button" class="confirm-return-btn">Confirm return</button>
        </div>

    </div>
</body>

</html>
